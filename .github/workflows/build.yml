# ============================================================================
# build.yml - CI quality gates for the CAD plugin source tree.
#
# Why not a full compile here?
#   The AutoCAD SDK assemblies (acdbmgd.dll / acmgd.dll / accoremgd.dll) are
#   Autodesk-licensed and are NOT committed to this repository. A clean CI
#   checkout therefore cannot compile the plugin. Real compilation requires
#   the SDK DLLs to be present locally; run `./build.ps1 -Check` on a dev
#   machine for that.
#
# What this workflow DOES verify on every push / pull request:
#   Job 1 - Structure Integrity:
#     - All 5 edition csproj files exist and are parseable XML
#     - Every <Compile Include> source file referenced by a legacy csproj exists
#     - Each deploy package ships PatentMarker.dll and the 8 shared VBA files
      (6 .bas/.cls + 1 .frm UserForm + 1 .frx binary blob)
#   Job 2 - Static Analysis:
#     - VBA modules are identical across all 5 deploy packages
#     - csproj TargetFramework matches the version matrix
#     - C# source files stay consistent within edition groups (Leader / MLeader)
#     - Deploy packages ship version-specific dependencies (e.g. Newtonsoft.Json)
#   Job 3 - Simulated host contracts:
#     - Replays real PATMARK command orchestration for Leader and MLeader editions
#       against strict fake editor/database/transaction hosts.
# ============================================================================

name: build

on:
  push:
  pull_request:

jobs:
  structure-check:
    name: Structure Integrity Check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run structure check
        shell: pwsh
        run: ./build.ps1 -Structure

      - name: Note on real compilation
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "AutoCAD SDK DLLs are not in the repo (Autodesk licensing)."
          Write-Host "Real compilation needs local SDK DLLs. On a dev machine run:"
          Write-Host "    ./build.ps1 -Check        # doctor: verify environment"
          Write-Host "    ./build.ps1 -Version 2025 # build the .NET 8 edition"

  static-analysis:
    name: Static Analysis
    runs-on: windows-latest
    needs: structure-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run static analysis
        shell: pwsh
        run: ./build.ps1 -Static

  tests:
    name: Portable unit tests
    runs-on: windows-latest
    needs: structure-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run portable tests
        shell: pwsh
        run: dotnet test ./cad-plugin/2025/PatentMarker.Tests/PatentMarker.Tests.csproj --configuration Release --nologo -v minimal

  simulated-host-contracts:
    name: Simulated host contract tests
    runs-on: windows-latest
    needs: structure-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run simulated edition contracts
        shell: pwsh
        run: ./build.ps1 -Simulation
